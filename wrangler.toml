name = "aether-version"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Deploy output is https://aether-version.<your-subdomain>.workers.dev
# Uncomment to serve on your own hostname instead:
# routes = [{ pattern = "version.example.com", custom_domain = true }]

# Exact cross-location counters: one instance per IP, plus one `global` instance.
# SQLite-backed, so this works on the Workers Free plan.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# HMAC_SECRET is a secret, not a var:
#   npx wrangler secret put HMAC_SECRET
#
# Announcements (GET /announcements, POST /announce) need a storage binding and a
# publish token. Either backend works:
#
#   KV, no GitHub write access needed, publish is one write:
#     npx wrangler kv namespace create ANNOUNCEMENTS
#     then uncomment and paste the id:
#   [[kv_namespaces]]
#   binding = "ANNOUNCEMENTS"
#   id = "<namespace id>"
#
#   GitHub, no new namespace, every publish is a commit:
#     npx wrangler secret put GITHUB_TOKEN     # contents:write on the Aether repo
#
# With neither, GET still serves the committed announcements.json and POST
# answers 501, so an unconfigured deploy is read-only rather than broken.
#
#   npx wrangler secret put PUBLISH_TOKEN      # the bearer token you publish with
